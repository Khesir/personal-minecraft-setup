  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    container_name: crafty
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ./crafty-data/backups:/crafty/backups
      - ./crafty-data/logs:/crafty/logs
      - ./crafty-data/servers:/crafty/servers
      - ./crafty-data/config:/crafty/app/config
      - ./crafty-data/import:/crafty/import
    ports:
      - "8443:8443"

  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: ${MC_TYPE}
      VERSION: ${MC_VERSION}
      MEMORY: ${MC_MEMORY}
      DIFFICULTY: ${MC_DIFFICULTY}
      MAX_PLAYERS: ${MC_MAX_PLAYERS}
      VIEW_DISTANCE: ${MC_VIEW_DISTANCE}
      MOTD: ${MC_MOTD}
      OPS: ${MC_OPS}
      LEVEL: ${MC_LEVEL}
      ONLINE_MODE: "FALSE"
    volumes:
      - ./mc-data:/data
    networks:
      - proxy

networks:
  proxy:
    external: false
